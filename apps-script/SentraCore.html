<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#f5f7fb;

height:100vh;

overflow:hidden;

}

.wrapper{

display:flex;

height:100vh;

}

/* SIDEBAR */

.sidebar{

width:260px;

background:#13293D;

color:white;

display:flex;

flex-direction:column;

}

.logo{

padding:28px;

font-size:24px;

font-weight:700;

border-bottom:1px solid rgba(255,255,255,.08);

}

.logo small{

display:block;

font-size:12px;

font-weight:400;

margin-top:6px;

opacity:.7;

}

.menu{

padding:20px;

display:flex;

flex-direction:column;

gap:8px;

}

.menu button{

background:none;

border:none;

color:white;

padding:14px 18px;

border-radius:10px;

cursor:pointer;

text-align:left;

font-size:15px;

transition:.25s;

}

.menu button:hover{

background:rgba(255,255,255,.08);

}

/* CONTENT */

.main{

flex:1;

display:flex;

flex-direction:column;

}

.topbar{

height:70px;

background:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

border-bottom:1px solid #e6e8ec;

}

.content{

flex:1;

padding:40px;

overflow:auto;

}

.card{

background:white;

padding:40px;

border-radius:18px;

box-shadow:0 5px 18px rgba(0,0,0,.05);

}

h1{

font-size:30px;

margin-bottom:10px;

}

p{

color:#666;

line-height:1.7;

}

.footer{

padding:20px;

font-size:12px;

color:#999;

}

  </style>

</head>

<body>

<div class="wrapper">

<div class="sidebar">

<div class="logo">

SentraCore™

<small>Intelligent Operations Platform</small>

</div>

<div class="menu">

<button>🏠 Home</button>

<button>🏢 Facilities</button>

<button>🛠 Assets</button>

<button onclick="loadUsers()">

👷 Users

</button>

<button>📋 Maintenance</button>

<button>📑 Work Orders</button>

<button>🚨 Incidents</button>

<button>📦 Inventory</button>

<button>⚡ Utilities</button>

<button>📊 Dashboards</button>

<button>⚙ Administration</button>

</div>

</div>

<div class="main">

<div class="topbar">

<h3>Welcome to SentraCore™</h3>

<div>

Version 1.0

</div>

</div>

<div class="content">

<div class="card">

<h1>Welcome 👋</h1>

<p>

SentraCore™ is now running.

Choose a module from the left to begin.

</p>

</div>

</div>

<div class="footer">

SentraCore™ © 2026

</div>

</div>

</div>

<script>

function loadUsers(){

google.script.run
.withSuccessHandler(function(html){

document.querySelector(".content").innerHTML=html;

})
.getUsersPage();

}

</script>

</body>

</html>
